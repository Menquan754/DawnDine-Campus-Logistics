[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dawndine"
version = "2.5.0"
description = "DawnDine · 校园后勤助手（食堂食安 + 后勤全域 · LangGraph + Gradio）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.0,<0.4.0",
    "langchain>=0.3.27,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-chroma>=0.2.0,<0.3.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "chromadb>=1.0.20,<2.0.0",
    "gradio>=5.0.0,<6.0.0",
    "pillow>=10.0.0,<13.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "dashscope>=1.20.0,<3.0.0",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
    "networkx>=3.6.1",
    "pyvis>=0.3.2",
]

[project.scripts]
dawndine = "dawndine.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dawndine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 系统提示词需要保持原文换行，长句不拆行。
"src/dawndine/prompts.py" = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
